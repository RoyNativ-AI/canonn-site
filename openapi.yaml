openapi: 3.1.0

info:
  title: Canonn API
  version: "1.0.0"
  summary: Grounded answers from your own documents.
  description: |
    Canonn serves **canonn-r1**, a model fine-tuned for context faithfulness: it
    answers from the documents you supply, says so when the answer is not there,
    and flags passages that contradict each other.

    The API is **OpenAI-compatible**. Point any OpenAI SDK at
    `https://api.canonn.ai/v1`, set your Canonn key, and existing code works
    unchanged.

    ## Authentication

    Every request carries a bearer key created in the
    [dashboard](https://canonn.ai/dashboard/):

    ```
    Authorization: Bearer canonn-sk-...
    ```

    A key is shown once at creation and stored only as a hash — it cannot be
    recovered, only revoked and replaced.

    ## How to prompt it

    Put the documents in the system message and the question in the user
    message. No rulebook is needed: faithfulness is trained into the weights,
    not instructed at runtime.

    ```
    system: Answer from the data below.

            Data: Refunds are accepted within 45 days of purchase.
    user:   What is the refund window?
    ```

    ## Pricing and limits

    Usage is billed per token — $1.20 per 1M input tokens, $6.00 per 1M output
    tokens — drawn from prepaid credits. Accounts without credits get 1,000 free
    calls per month; past that the API answers `402`. Context window is 16,384
    tokens.

    ## Errors

    Errors return the appropriate HTTP status with a JSON body of the shape
    `{"error": "message"}`.
  contact:
    name: Canonn
    email: hello@canonn.ai
    url: https://canonn.ai
  termsOfService: https://canonn.ai/legal/#terms
  license:
    name: Canonn Terms of Service
    url: https://canonn.ai/legal/#terms

servers:
  - url: https://api.canonn.ai/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Chat
    description: Generating grounded answers.
  - name: Models
    description: What this API serves.
  - name: Playground
    description: Keyless endpoints used by the public demo.

paths:
  /chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: Create a grounded completion
      description: |
        OpenAI-compatible chat completion. Set `stream: true` for server-sent
        events; chunks arrive as `data: {...}` lines terminated by `data: [DONE]`.

        Non-streamed generations longer than about 100 seconds can hit the
        edge's first-byte timeout — use streaming for long outputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              grounded:
                summary: Answer from supplied data
                value:
                  model: canonn-r1
                  messages:
                    - role: system
                      content: |
                        Answer from the data below.

                        Data: Refund window: 45 days from purchase. In-app purchases: refunded within 5 days.
                    - role: user
                      content: How long do I have to request a refund?
              absent:
                summary: A question the data cannot answer
                description: Canonn declines instead of inventing an answer.
                value:
                  model: canonn-r1
                  messages:
                    - role: system
                      content: |
                        Answer from the data below.

                        Data: Plan A costs 10 dollars per month.
                    - role: user
                      content: How much does Plan B cost?
              streaming:
                summary: Streamed response
                value:
                  model: canonn-r1
                  stream: true
                  messages:
                    - role: system
                      content: "Answer from the data below.\n\nData: Support hours are 9am to 5pm on weekdays."
                    - role: user
                      content: Is support available on Saturday?
      responses:
        "200":
          description: |
            A completion. When `stream` is true the media type is
            `text/event-stream` instead of `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
              examples:
                grounded:
                  value:
                    id: chatcmpl-8f4f7d976xch9d
                    object: chat.completion
                    created: 1786018376
                    model: canonn-r1
                    choices:
                      - index: 0
                        message:
                          role: assistant
                          content: The refund window is 45 days from purchase.
                        finish_reason: stop
                    usage:
                      prompt_tokens: 38
                      completion_tokens: 9
                      total_tokens: 47
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  value: |
                    data: {"id":"chatcmpl-…","object":"chat.completion.chunk","created":1786018376,"model":"canonn-r1","choices":[{"index":0,"delta":{"content":"No"},"finish_reason":null}]}

                    data: {"id":"chatcmpl-…","object":"chat.completion.chunk","created":1786018376,"model":"canonn-r1","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

                    data: [DONE]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

  /models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List available models
      responses:
        "200":
          description: The models this key can address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
              example:
                object: list
                data:
                  - id: canonn-r1
                    object: model
                    owned_by: canonn
        "401": { $ref: "#/components/responses/Unauthorized" }

  /models/catalog:
    get:
      tags: [Models]
      operationId: getModelCatalog
      summary: Model catalog with pricing
      description: |
        Public and unauthenticated. Returns the machine-readable catalog used by
        aggregators and marketplaces: context length, modalities, and per-token
        prices in USD.
      security: []
      responses:
        "200":
          description: Catalog entry per served model.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogModel" }
              example:
                data:
                  - id: canonn-r1
                    name: Canonn R1
                    created: 1785196800
                    description: A 9B model fine-tuned for context faithfulness.
                    input_modalities: [text]
                    output_modalities: [text]
                    context_length: 16384
                    max_output_length: 4096
                    pricing:
                      prompt: "0.0000012"
                      completion: "0.000006"
                      image: "0"
                      request: "0"
                      input_cache_read: "0.0000012"
                    quantization: bf16
                    supported_sampling_parameters: [temperature, top_p, max_tokens, stop, seed]
                    supported_features: [streaming]
                    datacenters: [FIN]
                    is_ready: true
                    is_free: false

  /demo:
    post:
      tags: [Playground]
      operationId: runDemo
      summary: Keyless demo call
      description: |
        Powers the public playground on canonn.ai. No key required, rate limited
        per IP, with tighter length limits than the main endpoint. Set
        `stream: true` to receive server-sent events instead of JSON.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, question]
              properties:
                data:
                  type: string
                  maxLength: 8000
                  description: The documents to answer from.
                question:
                  type: string
                  maxLength: 500
                stream:
                  type: boolean
                  default: false
            example:
              data: "Refund window: 45 days from purchase."
              question: How long do I have to request a refund?
      responses:
        "200":
          description: The grounded answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  seconds: { type: number }
              example:
                answer: The refund window is 45 days from purchase.
                seconds: 0.8
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Canonn API key, created in the dashboard (`canonn-sk-...`).

  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid json }
    Unauthorized:
      description: Missing, malformed, or revoked API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid api key }
    PaymentRequired:
      description: |
        The free-tier allowance for the month is spent and the account has no
        credits. Add credits in the dashboard to continue.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: Free tier limit reached for this month (1000 calls). Add credits in the dashboard to continue.
    RateLimited:
      description: Too many requests in the current window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Playground limit reached - try again in an hour. }
    UpstreamUnavailable:
      description: The model could not be reached. Retry; requests are not billed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: upstream unavailable }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A human-readable description of what went wrong.
      required: [error]

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
          description: |
            Put the documents to answer from in the `system` message and the
            question in the `user` message.
        content:
          type: string

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          default: canonn-r1
          description: |
            Always `canonn-r1`. Unknown values are normalised to it rather than
            rejected, so older integrations keep working.
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Message" }
        stream:
          type: boolean
          default: false
          description: Return server-sent events instead of a single JSON body.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0
          description: Leave at 0 for extraction work; higher values only add variance.
        max_tokens:
          type: integer
          minimum: 1
          default: 1024
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stop:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        seed:
          type: integer
          description: Same seed and inputs produce the same answer.

    Choice:
      type: object
      properties:
        index: { type: integer }
        message: { $ref: "#/components/schemas/Message" }
        finish_reason:
          type: string
          enum: [stop, length]
          description: |
            `length` means the answer was cut off by `max_tokens` - raise it and
            retry rather than shipping a truncated answer.

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    ChatCompletion:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer, description: Unix seconds. }
        model: { type: string }
        choices:
          type: array
          items: { $ref: "#/components/schemas/Choice" }
        usage: { $ref: "#/components/schemas/Usage" }

    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: model }
        owned_by: { type: string }

    CatalogModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: integer }
        description: { type: string }
        input_modalities:
          type: array
          items: { type: string }
        output_modalities:
          type: array
          items: { type: string }
        context_length: { type: integer }
        max_output_length: { type: integer }
        pricing:
          type: object
          description: USD per token, as strings.
          properties:
            prompt: { type: string }
            completion: { type: string }
            image: { type: string }
            request: { type: string }
            input_cache_read: { type: string }
        quantization: { type: string }
        hugging_face_id: { type: [string, "null"] }
        supported_sampling_parameters:
          type: array
          items: { type: string }
        supported_features:
          type: array
          items: { type: string }
        datacenters:
          type: array
          items: { type: string }
        is_ready: { type: boolean }
        is_free: { type: boolean }
